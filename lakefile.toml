name = "credibility"
version = "0.1.0"
defaultTargets = ["Credibility"]
# Mathlib is written for the module system; this project is not. Without this,
# Lake warns on every file that imports Mathlib, on every build.
allowNonModules = true

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
# First session: run `lake update`, then pin this to the resulting commit
# (see CLAUDE.md). Bump deliberately — each bump invalidates the cache.
rev = "e293c42021c641734f10655c39b8023fa88ff6ee"

[[lean_lib]]
name = "Credibility"
