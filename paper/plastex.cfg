# plasTeX config for the web version of the paper (CI: `plastex -c plastex.cfg paper.tex`).
# One page (split-level=-1), so the search box and the browser's find see everything.
[general]
renderer=HTML5
copy-theme-extras=yes

[document]
toc-depth=2

[files]
directory=web/
split-level=-1

[html5]
localtoc-level=0
extra-js=search.js
mathjax-dollars=False

# The figures (tikzpicture) become SVGs via latex + dvisvgm.
[images]
vector-imager=dvisvgm
