name: Blueprint

# Builds Lean, the blueprint (web + pdf) and checks they agree, in two parallel
# jobs (`lean`, `docs`).
# Deploys to GitHub Pages on pushes to main.
# Pushes to main and tags only: session branches (ccr-…, claude/…) used to
# trigger a second, duplicate run of every commit.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Two jobs in parallel: `lean` needs no TeX and `docs` needs no Lean, so the
  # run takes as long as the slower one, not their sum.
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every download below is retried (scripts/retry.sh): most past failures
      # were a 503/504 from github.com or releases.lean-lang.org before the
      # build even started. The toolchain and Mathlib are cached, so a normal
      # run downloads neither.
      - name: Cache Lean toolchain
        id: elan-cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}

      - name: Install Lean
        run: |
          if [ "${{ steps.elan-cache.outputs.cache-hit }}" != "true" ]; then
            bash scripts/retry.sh sh -c 'curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none --no-modify-path'
            bash scripts/retry.sh "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Mathlib
        id: mathlib-cache
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      # The cached .lake/packages already holds Mathlib's compiled files.
      - name: Get Mathlib cache
        if: steps.mathlib-cache.outputs.cache-hit != 'true'
        run: bash scripts/retry.sh lake exe cache get

      # The project's own compiled files from the latest earlier run. Lake
      # compares content hashes, so only files that changed (and the files
      # importing them) are rebuilt.
      - name: Cache project build
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - name: Build Lean project
        run: lake build

      # Open `sorry`s are fine on main while a file is in progress; what must
      # not happen is a theorem counted as proved that depends on one, or an
      # axiom beyond propext, Classical.choice, Quot.sound.
      - name: Audit axioms
        run: |
          python3 scripts/progress.py --proved > "$RUNNER_TEMP/proved.txt"
          lake env lean --run scripts/CheckAxioms.lean "$RUNNER_TEMP/proved.txt"

      # A blueprint proof that \uses a result must refer to it in Lean, so a
      # special case marked as a corollary of a general result really is one.
      - name: Check blueprint \uses against the Lean proofs
        run: |
          python3 scripts/blueprint_check.py --uses > "$RUNNER_TEMP/uses.txt"
          lake env lean --run scripts/CheckUses.lean "$RUNNER_TEMP/uses.txt"

      # The \lean names are read from content.tex (the `docs` job checks that
      # this list is the one leanblueprint writes), so no TeX is needed here.
      - name: Check blueprint and handbook against Lean
        run: |
          python3 scripts/progress.py --check
          python3 scripts/blueprint_check.py
          python3 scripts/blueprint_check.py --decls > "$RUNNER_TEMP/decls.txt"
          lake env lean --run scripts/CheckDecls.lean "$RUNNER_TEMP/decls.txt"
          python3 scripts/handbook_check.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX, graphviz and leanblueprint
        run: |
          bash scripts/retry.sh sudo apt-get update
          bash scripts/retry.sh sudo apt-get install -y --no-install-recommends \
            graphviz libgraphviz-dev latexmk texlive-xetex texlive-latex-extra \
            texlive-fonts-recommended texlive-science lmodern fonts-lmodern
          bash scripts/retry.sh pip install leanblueprint==0.0.20

      - name: Build blueprint
        working-directory: blueprint
        run: |
          leanblueprint pdf
          leanblueprint web
          cp print/print.pdf web/blueprint.pdf

      - name: Build handbook
        working-directory: handbook
        run: |
          latexmk -xelatex -interaction=nonstopmode -halt-on-error handbook.tex
          cp handbook.pdf ../blueprint/web/handbook.pdf

      # The `lean` job checks the names from `blueprint_check.py --decls`;
      # make sure that is the list leanblueprint itself extracted.
      - name: Check the declaration list and write the source links
        run: |
          diff <(sort -u blueprint/lean_decls) <(python3 scripts/blueprint_check.py --decls | sort -u)
          python3 scripts/blueprint_find.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: blueprint/web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [lean, docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
