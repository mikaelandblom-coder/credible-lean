name: Blueprint

# Builds Lean, the blueprint (web + pdf) and checks they agree, in two parallel
# jobs (`lean`, `docs`); `docs` also builds the handbook and the paper (PDF, and
# the paper as a web page at /paper/) and tests the app (app/), published at /app/.
# Deploys to GitHub Pages on pushes to main.
# Pushes to main and tags only: session branches (ccr-…, claude/…) used to
# trigger a second, duplicate run of every commit.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Two jobs in parallel: `lean` needs no TeX and `docs` needs no Lean, so the
  # run takes as long as the slower one, not their sum.
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every download below is retried (scripts/retry.sh): most past failures
      # were a 503/504 from github.com or releases.lean-lang.org before the
      # build even started. The toolchain and Mathlib are cached, so a normal
      # run downloads neither.
      - name: Cache Lean toolchain
        id: elan-cache
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}

      - name: Install Lean
        run: |
          if [ "${{ steps.elan-cache.outputs.cache-hit }}" != "true" ]; then
            bash scripts/retry.sh sh -c 'curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none --no-modify-path'
            bash scripts/retry.sh "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Mathlib
        id: mathlib-cache
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      # The cached .lake/packages already holds Mathlib's compiled files.
      - name: Get Mathlib cache
        if: steps.mathlib-cache.outputs.cache-hit != 'true'
        run: bash scripts/retry.sh lake exe cache get

      # The project's own compiled files from the latest earlier run. Lake
      # compares content hashes, so only files that changed (and the files
      # importing them) are rebuilt.
      - name: Cache project build
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}-

      - name: Build Lean project
        run: lake build

      # Open `sorry`s are fine on main while a file is in progress; what must
      # not happen is a theorem counted as proved that depends on one, or an
      # axiom beyond propext, Classical.choice, Quot.sound.
      - name: Audit axioms
        run: |
          python3 scripts/progress.py --proved > "$RUNNER_TEMP/proved.txt"
          lake env lean --run scripts/CheckAxioms.lean "$RUNNER_TEMP/proved.txt"

      # A blueprint proof that \uses a result must refer to it in Lean, so a
      # special case marked as a corollary of a general result really is one.
      - name: Check blueprint \uses against the Lean proofs
        run: |
          python3 scripts/blueprint_check.py --uses > "$RUNNER_TEMP/uses.txt"
          lake env lean --run scripts/CheckUses.lean "$RUNNER_TEMP/uses.txt"

      # The \lean names are read from content.tex (the `docs` job checks that
      # this list is the one leanblueprint writes), so no TeX is needed here.
      - name: Check blueprint and handbook against Lean
        run: |
          python3 scripts/progress.py --check
          python3 scripts/blueprint_check.py
          python3 scripts/blueprint_check.py --decls > "$RUNNER_TEMP/decls.txt"
          lake env lean --run scripts/CheckDecls.lean "$RUNNER_TEMP/decls.txt"
          python3 scripts/handbook_check.py
          python3 scripts/paper_check.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TeX: a small TeX Live (the official installer, only the packages in
      # .github/texlive-packages.txt), cached. Installing texlive from apt on
      # every run took 1.5 to 18 minutes depending on the Ubuntu mirror.
      - name: Cache TeX Live
        id: tex-cache
        uses: actions/cache@v4
        with:
          path: ~/texlive
          key: texlive-${{ runner.os }}-${{ hashFiles('.github/texlive-packages.txt') }}

      - name: Install TeX Live
        if: steps.tex-cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          bash "$GITHUB_WORKSPACE/scripts/retry.sh" curl -sSfLO \
            https://mirror.ctan.org/systems/texlive/tlnet/install-tl-unx.tar.gz
          tar xzf install-tl-unx.tar.gz
          cat > texlive.profile <<EOF
          selected_scheme scheme-basic
          TEXDIR $HOME/texlive
          TEXMFLOCAL $HOME/texlive/texmf-local
          TEXMFSYSCONFIG $HOME/texlive/texmf-config
          TEXMFSYSVAR $HOME/texlive/texmf-var
          tlpdbopt_install_docfiles 0
          tlpdbopt_install_srcfiles 0
          tlpdbopt_autobackup 0
          instopt_adjustpath 0
          EOF
          cd install-tl-2*
          bash "$GITHUB_WORKSPACE/scripts/retry.sh" perl install-tl --no-interaction \
            --profile="$RUNNER_TEMP/texlive.profile"
          bash "$GITHUB_WORKSPACE/scripts/retry.sh" "$HOME/texlive/bin/x86_64-linux/tlmgr" \
            install $(grep -v '^#' "$GITHUB_WORKSPACE/.github/texlive-packages.txt")

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-leanblueprint-0.0.20

      # graphviz (for leanblueprint's dependency graph) is small; skip the
      # man-db trigger, which is slow on the runners.
      - name: Install graphviz and leanblueprint
        run: |
          echo "$HOME/texlive/bin/x86_64-linux" >> "$GITHUB_PATH"
          sudo rm -f /var/lib/man-db/auto-update
          bash scripts/retry.sh sudo apt-get update
          bash scripts/retry.sh sudo apt-get install -y --no-install-recommends \
            graphviz libgraphviz-dev
          bash scripts/retry.sh pip install leanblueprint==0.0.20

      - name: Build blueprint
        working-directory: blueprint
        run: |
          leanblueprint pdf
          leanblueprint web
          cp print/print.pdf web/blueprint.pdf

      - name: Build handbook
        working-directory: handbook
        run: |
          latexmk -xelatex -interaction=nonstopmode -halt-on-error handbook.tex
          cp handbook.pdf ../blueprint/web/handbook.pdf

      # The paper (paper/outline.md): a PDF next to the handbook, and one web
      # page with a search box at /paper/ (plasTeX comes with leanblueprint).
      - name: Build paper
        working-directory: paper
        run: |
          latexmk -xelatex -interaction=nonstopmode -halt-on-error paper.tex
          cp paper.pdf ../blueprint/web/paper.pdf
          plastex -c plastex.cfg paper.tex
          mkdir -p ../blueprint/web/paper
          cp -r web/. ../blueprint/web/paper/

      # The `lean` job checks the names from `blueprint_check.py --decls`;
      # make sure that is the list leanblueprint itself extracted.
      - name: Check the declaration list and write the source links
        run: |
          diff <(sort -u blueprint/lean_decls) <(python3 scripts/blueprint_check.py --decls | sort -u)
          python3 scripts/blueprint_find.py

      # The practitioner app (studies/PLAN.md): its engine's identity tests run
      # under Node, then the page is published at /app/ next to the blueprint.
      - name: Test and add the app
        run: |
          node --test app/engine.test.js app/monthly.test.js
          mkdir -p blueprint/web/app
          cp -r app/index.html app/engine.js app/monthly.js app/manifest.webmanifest app/icons blueprint/web/app/

      # The master thesis proposal (studies/thesis-topics/make_pdf.py builds the committed PDF).
      - name: Add the thesis proposal
        run: cp studies/thesis-topics/thesis_topics.pdf blueprint/web/thesis-proposal.pdf

      - uses: actions/upload-pages-artifact@v3
        with:
          path: blueprint/web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [lean, docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
